<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Search Restaurants</title>
    <!-- Link to the newly separated CSS file -->
    <link rel="stylesheet" href="/css/search.css">
</head>
<body>
    <div class="container">
        <!-- Links back to the dashboard -->
        <a href="/index.html" class="btn-back nav-link">← Back to Dashboard</a>
        
        <header>
            <h1>🍽️ Discover Restaurants</h1>
            
            <div class="search-section">
                <div class="search-group">
                    <label for="search-input">Search by name or cuisine</label>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="e.g., sushi, pizza, Thai"
                        autocomplete="off"
                    />
                </div>

                <div class="search-group">
                    <label for="radius-input">Search radius (meters)</label>
                    <select id="radius-input">
                        <option value="1000">1 km</option>
                        <option value="1500" selected>1.5 km</option>
                        <option value="2000">2 km</option>
                        <option value="3000">3 km</option>
                        <option value="5000">5 km</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-location" id="use-location-btn">📍 Use My Location</button>
                    <button class="btn-search" id="search-btn">Search</button>
                </div>
            </div>
        </header>

        <div id="status-message"></div>
        <div id="loading">
            <div class="spinner"></div>
            <p>Searching for restaurants...</p>
        </div>
        <div id="results-container" class="results-container"></div>
    </div>

    <!-- Keep JS logic separated as well -->
    <script src="/JavaScripts/search.js"></script>
</body>
</html>
